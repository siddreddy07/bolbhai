services:
  app:
    build:
      context: ./server
    container_name: bolbhai-app
    env_file:
      - path: ./server/.env
        required: false # a fresh checkout has no .env: that is fine
    ports:
      - "8080:8080"
    environment:
      # Ollama runs on your PC, not inside this container
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/api
