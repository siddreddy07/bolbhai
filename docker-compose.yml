services:
  app:
    image: bolbhai
    container_name: bolbhai-app
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://bolbhai:bolbhai_dev@postgres:5432/bolbhai
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:17-alpine
    container_name: bolbhai-postgres
    environment:
      POSTGRES_USER: bolbhai
      POSTGRES_PASSWORD: bolbhai_dev
      POSTGRES_DB: bolbhai
    ports:
      - "5432:5432"
    
    volumes:
      - bolbhai_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolbhai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bolbhai_data: